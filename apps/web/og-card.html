<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Pyx social card</title>
<link rel="stylesheet" href="assets/site.css">
<style>
  body { width: 1200px; height: 630px; overflow: hidden; }
  .card { position: absolute; inset: 0; z-index: 1; padding: 64px 72px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; align-items: center; }
  .card h1 { text-align: left; margin: 22px 0 0; font-size: 70px; max-width: 12ch; }
  .card .changes { width: 100%; }
  .card .brand { font-size: 26px; }
</style>
</head>
<body>
<div class="field" aria-hidden="true"></div>
<div class="card">
  <div>
    <span class="brand"><svg viewBox="0 0 32 32" style="width:34px;height:34px"><rect x="3.75" y="3.75" width="24.5" height="24.5" rx="8.25" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.75)" stroke-width="1.5"/><circle cx="16" cy="16" r="6.4" fill="#fff"/><path d="M13.4 16.2l1.8 1.8 3.4-3.6" stroke="#0a0c12" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>Pyx</span>
    <h1>Catch the release that leaks customer data.</h1>
  </div>
  <div class="glass glass--dim" style="padding:20px;--r:26px">
    <ul class="changes">
      <li class="change change--gain"><span class="change__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span class="change__text"><b>Alice can now open Bob’s invoice</b><small>GET /api/invoices/:id</small></span></li>
      <li class="change change--ok"><span class="change__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12.5l4 4L18 8"/></svg></span><span class="change__text"><b>Database rules unchanged</b><small>/rest/v1/invoices</small></span></li>
    </ul>
  </div>
</div>
</body>
</html>
