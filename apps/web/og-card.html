<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Pyx social card</title>
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/site.css">
<style>
  body.rp { width: 1200px; height: 630px; overflow: hidden; }
  body.rp > .card { position: absolute; inset: 0; padding: 64px 72px; display: flex; flex-direction: column; justify-content: space-between; }
  .card .display { font-size: 92px; }
  .row { display: flex; justify-content: space-between; align-items: flex-end; }
  .ledge { width: 420px; padding: 0; overflow: hidden; }
  .ledge div { display: flex; justify-content: space-between; padding: 14px 20px; border-bottom: 1px solid var(--rp-line); font-size: 15px; }
  .ledge div:last-child { border-bottom: 0; }
</style>
</head>
<body class="rp">
  <div class="card">
    <span class="rp-brand"><svg class="rp-logo" style="width:34px;height:34px" viewBox="0 0 32 32"><defs><linearGradient id="b1" x1="3" y1="3" x2="29" y2="29" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#efe2c2"/><stop offset=".5" stop-color="#c9b38a"/><stop offset="1" stop-color="#8f7a55"/></linearGradient></defs><path d="M9 3.5h14l5.5 5.5v14L23 28.5H9L3.5 23V9L9 3.5Z" fill="none" stroke="url(#b1)" stroke-width="1.5"/><path d="M10 11.5h12" stroke="url(#b1)" stroke-width="2.2" stroke-linecap="round"/><path d="M10 16h12M10 20.5h7" stroke="#ece6db" stroke-opacity=".38" stroke-width="2.2" stroke-linecap="round"/></svg>Pyx</span>
    <div class="row">
      <h1 class="display">Every user sees<br>their own data.<br><em>Nothing else.</em></h1>
      <div class="rp-glass ledge">
        <div><span>Alice → invoice A</span><span class="rp-pass">Returned</span></div>
        <div><span>Alice → invoice B</span><span class="rp-fail">Disclosed</span></div>
        <div><span>Anonymous → any</span><span class="rp-muted">Not disclosed</span></div>
      </div>
    </div>
  </div>
</body>
</html>
