<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Pyx social card</title>
<link rel="stylesheet" href="assets/site.css">
<style>
  body { width: 1200px; height: 630px; overflow: hidden; margin: 0; }
  .card { position: relative; width: 1200px; height: 630px; padding: 64px 72px; display: grid; grid-template-columns: 1.05fr 1fr; gap: 56px; align-items: center; }
  .card::before { content: ""; position: absolute; inset: -40% -10% auto; height: 700px; background: radial-gradient(50% 50% at 70% 30%, rgba(170, 190, 255, 0.09), transparent 70%); }
  .brand { position: absolute; top: 56px; left: 72px; font-size: 24px; }
  .brand svg { width: 30px; height: 30px; }
  h1 { font-size: 64px; line-height: 1.03; letter-spacing: -0.045em; margin-top: 30px; }
  h1 .dim { display: block; }
  .rows { border-radius: 18px; box-shadow: inset 0 0 0 1px var(--line); padding: 14px 0; font: 400 15px/1 var(--mono); }
  .row { display: grid; grid-template-columns: 108px 86px 196px 1fr; gap: 10px; padding: 12px 22px; color: rgba(237, 237, 239, 0.5); border-bottom: 1px solid rgba(255, 255, 255, 0.04); }
  .row:last-child { border-bottom: 0; }
  .row b { font-weight: 500; }
  .row--leak { background: rgba(255, 106, 92, 0.08); color: rgba(237, 237, 239, 0.85); }
</style>
</head>
<body>
<div class="card">
  <span class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3.75" y="3.75" width="24.5" height="24.5" rx="8.25" fill="rgba(255,255,255,.12)" stroke="rgba(255,255,255,.75)" stroke-width="1.5"/><circle cx="16" cy="16" r="6.4" fill="#fff"/><path d="M13.4 16.2l1.8 1.8 3.4-3.6" stroke="#0a0c12" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>&nbsp;Pyx</span>
  <h1>Alice can’t open Bob’s invoice. <span class="dim">Pyx checks before every release.</span></h1>
  <div class="rows">
    <div class="row"><span>alice</span><span>inv_a</span><span>/rest/v1/invoices</span><b class="t-pass">own record</b></div>
    <div class="row"><span>alice</span><span>inv_b</span><span>/rest/v1/invoices</span><span>hidden</span></div>
    <div class="row"><span>alice</span><span>inv_b</span><span>/rpc/get_invoice</span><span>hidden</span></div>
    <div class="row row--leak"><span>alice</span><span>inv_b</span><span>/api/invoices/:id</span><b class="t-leak">LEAKED</b></div>
    <div class="row"><span>anonymous</span><span>inv_b</span><span>/api/invoices/:id</span><span>hidden</span></div>
  </div>
</div>
</body>
</html>
