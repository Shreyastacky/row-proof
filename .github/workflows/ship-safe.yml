# Ship Safe CI: unit/contract checks, the real-HTTP integration harness, and an
# assessment that reads the approved baseline from the BASE branch.
#
# Trust notes:
# - Triggered by `pull_request`, never `pull_request_target`; fork PRs get a read-only
#   token and no secrets. This workflow uses no secrets at all: every credential is
#   minted inside a disposable local Supabase stack on the runner.
# - The runner code exercised here comes from the candidate PR. These are DEVELOPMENT
#   TESTS of the runner, not trusted customer assessments. A trusted assessment needs a
#   pinned, released runner and an execution policy outside the PR's control (for
#   example a required workflow from a separate repository). That is not configured.
# - Reading `baseline/` from the base branch only matters if the base branch is
#   protected. Branch protection/rulesets are not configured by this file.
name: ship-safe

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ship-safe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: contracts and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (reads packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  integration:
    name: real-HTTP integration harness (healthy + throwaway broken-policy instance)
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run harness (starts, provisions, assesses, and always tears down)
        run: pnpm integration
      - name: Upload redacted artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ship-safe-integration
          path: artifacts/integration/
          if-no-files-found: warn
          retention-days: 14
      - name: Teardown (belt and braces)
        if: always()
        run: node scripts/stack.mjs down || true

  assess-with-base-branch-baseline:
    name: assess using the approved baseline from the base branch
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TRUSTED_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Fetch base branch
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
      - name: Materialize approved baseline from the base branch (not the PR tree)
        id: baseline
        run: |
          set +e
          node scripts/fetch-trusted-baseline.mjs --ref "$TRUSTED_REF" --path baseline --out "$RUNNER_TEMP/trusted-baseline"
          code=$?
          set -e
          if [ "$code" = "3" ]; then
            echo "::notice::No approved baseline exists on $TRUSTED_REF yet. Assessment NOT RUN (this is not a pass)."
            echo "available=false" >> "$GITHUB_OUTPUT"
          elif [ "$code" = "0" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi
      - name: Flag baseline edits in this PR
        if: github.event_name == 'pull_request'
        run: |
          changed=$(git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" -- baseline/ || true)
          if [ -n "$changed" ]; then
            echo "::warning::This PR changes baseline/. Those changes are proposals and are NOT used for this assessment; they apply only after review and merge to ${GITHUB_BASE_REF}."
          fi
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.baseline.outputs.available == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.baseline.outputs.available == 'true'
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.baseline.outputs.available == 'true'
        run: pnpm install --frozen-lockfile && pnpm build
      - name: Start disposable stack and provision synthetic fixtures
        if: steps.baseline.outputs.available == 'true'
        run: |
          pnpm stack:up
          pnpm fixture:provision
      - name: Assess (exit 0 pass, 1 violation, 2 blocked)
        if: steps.baseline.outputs.available == 'true'
        run: >
          pnpm ship-safe run
          --store "$RUNNER_TEMP/trusted-baseline"
          --rule invoice-owner-read
          --env-file .ship-safe/local.env
          --execution-context ci-development
          --out artifacts/assessment/result.json
      - name: Upload redacted result
        if: always() && steps.baseline.outputs.available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ship-safe-assessment
          path: |
            artifacts/assessment/
            ${{ runner.temp }}/trusted-baseline/SOURCE.txt
          if-no-files-found: warn
          retention-days: 14
      - name: Teardown
        if: always()
        run: |
          node scripts/stack.mjs down || true
          rm -f .ship-safe/local.env
