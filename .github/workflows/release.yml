# Publishes pyx-cli to npm with provenance when a version tag (v*) is pushed.
#
# Provenance links each published package to this repository, this workflow and the
# exact commit, through Sigstore. Anyone can check it with `npm audit signatures`
# after installing. Before the first release:
#   1. On npmjs.com, add this repository and workflow as a trusted publisher for
#      pyx-cli (OIDC; no long-lived token), or store an automation token as the
#      NPM_TOKEN secret in a protected "npm" environment.
#   2. Protect v* tags so only maintainers can create them.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/pyx.yml

  publish:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write # required for npm provenance (Sigstore OIDC)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Tag matches the package version
        run: test "v$(node -p "require('./packages/cli/package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Build and smoke-test the tarball from a clean install
        run: pnpm --filter pyx-cli run smoke
      - name: Publish with provenance
        working-directory: packages/cli
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
